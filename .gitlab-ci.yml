stages:
  - build
  - publish

variables:
  GIT_SUBMODULE_STRATEGY: "none"
  PIP_INDEX_URL: "http://10.16.1.201:9929/nightly/dtk2604/+simple/"
  PIP_TRUSTED_HOST: "10.16.1.201"
  DTK_PKG: "/ArchivedFile/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz"
  DEVPI_URL: "http://10.16.1.201:9929/"
  TORCH_VERSION: "2.10.0"

build:flashmla-wheel:
  stage: build
  timeout: 3h
  parallel:
    matrix:
      - RUNNER_TAG: [nmz, bw]
  tags:
    - ${RUNNER_TAG}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-aicc"'
  before_script:
    # Install DTK, AICC, Torch and Python dependencies.
    - source ci_script/prepare_environment.sh
    # Configure non-interactive Git authentication without changing remote URL.
    - |
      cat > /tmp/git-askpass.sh << 'SCRIPT'
      #!/bin/sh
      case "$1" in
        *Username*) echo "gitlab-ci-token" ;;
        *Password*) echo "$GIT_TOKEN" ;;
      esac
      SCRIPT
    - chmod 700 /tmp/git-askpass.sh
    - export GIT_ASKPASS=/tmp/git-askpass.sh
    - export GIT_TERMINAL_PROMPT=0
    - export GIT_TOKEN="${CI_JOB_TOKEN}"
    # Test the prospective merge result against target branch.
    - git config user.email "ci@local"
    - git config user.name "CI"
    - git fetch origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
    - git merge "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" --no-edit
    # Detach-avoidance: create a named branch so optest --test_dir can
    # identify the branch for its output directory.
    - git checkout -B _ci_mr
  script:
    - bash ci_script/build_wheel_and_manylinux.sh
    - python -m pip install --force-reinstall --no-deps dist/*manylinux*.whl
    - optest --op_name flashmla --test_mode all --test_dir "${CI_PROJECT_DIR}" || true
    - python ci_script/optest_to_junit.py "${CI_PROJECT_DIR}" "${RUNNER_TAG}"
  artifacts:
    when: always
    paths:
      - dist/*manylinux*.whl
      - tests/${RUNNER_TAG}_flashmla_performance_output.xml
    reports:
      junit: tests/${RUNNER_TAG}_flashmla_performance_output.xml
    expire_in: 7 days

publish:
  stage: publish
  image: "${BUILD_IMAGE}"
  timeout: 3h
  tags:
    - nmz
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "master-aicc"'
  parallel:
    matrix:
      - BUILD_IMAGE:
          - "image.sourcefind.cn:5000/dcu/admin/base/dev:rockylinux8.6-mpi5.0-gcc10.3-cmake3.29-py3.10-mkl2020.4.304"
          - "harbor.sourcefind.cn:5443/dcu/admin/base/dev:rockylinux8.6-mpi5.0-gcc10.3-cmake3.29-py3.12-mkl2020.4.304"
        TORCH_VERSION: ["2.10.0", "2.11.0"]
  before_script:
    # Install DTK, AICC, Torch and Python dependencies.
    - source ci_script/prepare_environment.sh
    # Configure non-interactive Git authentication without changing remote URL.
    - |
      cat > /tmp/git-askpass.sh << 'SCRIPT'
      #!/bin/sh
      case "$1" in
        *Username*) echo "gitlab-ci-token" ;;
        *Password*) echo "$GIT_TOKEN" ;;
      esac
      SCRIPT
    - chmod 700 /tmp/git-askpass.sh
    - export GIT_ASKPASS=/tmp/git-askpass.sh
    - export GIT_TERMINAL_PROMPT=0
    - export GIT_TOKEN="${CI_JOB_TOKEN}"
  script:
    - bash ci_script/build_wheel_and_manylinux.sh
    - DTK_VER="$(echo "${DTK_PKG}" | grep -oP 'dtk\K[0-9]+\.[0-9]+' | tr -d '.')"
    - TORCH_VER="${TORCH_VERSION}"
    - COMMIT_ID="$(git rev-parse --short=6 HEAD)"
    - CIUpload REPAIR --dtk_version ${DTK_VER} --torch_version ${TORCH_VER} --git_commit ${COMMIT_ID} --outputdir output -f dist/*manylinux*.whl
    - CIUpload NIGHTLY --password ${devpi_nightly_password} --dtk_pkg_name $(basename ${DTK_PKG}) -f output/*.whl --record
  artifacts:
    paths:
      - output/*.whl
    expire_in: 30 days
