stages:
  - quality-gate
  - build
  - publish

variables:
  GIT_SUBMODULE_STRATEGY: "none"
  HARBOR_SITE: "10.16.1.152:5000"
  PYPI_URL: "http://10.16.1.201:9929"
  PIP_TRUSTED_HOST: "10.16.1.201"
  AICC_BASE_URL: "http://10.16.1.201:8000/ai_cc/Nightly"
  TORCH_VERSION: "2.11.0"
quality-gate:
  stage: quality-gate
  allow_failure: true
  variables:
    GIT_DEPTH: "0"
    GATE_PIP_INDEX_URL: "${PYPI_URL}/nightly/dtk2604/+simple/"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-aicc"'
  tags:
    - nmz
  script:
    - >-
      python -m pip install "hygon_quality_gate[scanners]"
      -i "${GATE_PIP_INDEX_URL}"
      --trusted-host "${PIP_TRUSTED_HOST}"
    - python -m hygon_pr_gate.install_tools
    - git fetch origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
    - quality-pr-scan --base "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" --head "${CI_COMMIT_SHA}"

build:flashmla-wheel:
  stage: build
  image: "${HARBOR_SITE}/hcu/base/dtk:${DTK_VERSION}-rockylinux8.6-py${PY_VERSION}"
  timeout: 3h
  parallel:
    matrix:
      - RUNNER_TAG: [nmz, bw]
        DTK_VERSION: "26.04"
        PY_VERSION: "3.12"
        DTK_PIP_INDEX_URL: "${PYPI_URL}/nightly/dtk2604/+simple/"
      - RUNNER_TAG: [nmz, bw]
        DTK_VERSION: "26.10"
        PY_VERSION: "3.12"
        DTK_PIP_INDEX_URL: "${PYPI_URL}/nightly/dtk2610/+simple/"
  tags:
    - ${RUNNER_TAG}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-aicc"'
  before_script:
    - python -m pip install "torch==${TORCH_VERSION}" triton -i "${DTK_PIP_INDEX_URL}" --trusted-host "${PIP_TRUSTED_HOST:-10.16.1.201}"
    - source ci_script/prepare_environment.sh
    # Configure non-interactive Git authentication without changing remote URL.
    - |
      cat > /tmp/git-askpass.sh << 'SCRIPT'
      #!/bin/sh
      case "$1" in
        *Username*) echo "gitlab-ci-token" ;;
        *Password*) echo "$GIT_TOKEN" ;;
      esac
      SCRIPT
    - chmod 700 /tmp/git-askpass.sh
    - export GIT_ASKPASS=/tmp/git-askpass.sh
    - export GIT_TERMINAL_PROMPT=0
    - export GIT_TOKEN="${CI_JOB_TOKEN}"
    # Test the prospective merge result against target branch.
    - git config user.email "ci@local"
    - git config user.name "CI"
    - git fetch origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
    - git merge "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" --no-edit
    # Detach-avoidance: create a named branch so optest --test_dir can
    # identify the branch for its output directory.
    - git checkout -B _ci_mr
  script:
    - bash ci_script/build_wheel_and_manylinux.sh
    - python -m pip install --force-reinstall --no-deps dist/*manylinux*.whl
    - |
      optest_status=0
      optest --op_name flashmla --test_mode all --test_dir "${CI_PROJECT_DIR}" || optest_status=$?
      python ci_script/optest_to_junit.py "${CI_PROJECT_DIR}" "${RUNNER_TAG}_dtk${DTK_VERSION}" || true
      exit "$optest_status"
  artifacts:
    when: always
    paths:
      - dist/*manylinux*.whl
      - tests/${RUNNER_TAG}_dtk${DTK_VERSION}_flashmla_performance_output.xml
    reports:
      junit: tests/${RUNNER_TAG}_dtk${DTK_VERSION}_flashmla_performance_output.xml
    expire_in: 7 days

# Publish torch 2.11 wheels for every supported DTK/CPython pair:
#   dtk2610 | py3.12
#   dtk2604 | py3.10, py3.12
publish:
  stage: publish
  image: "${HARBOR_SITE}/hcu/base/dtk:${DTK_VERSION}-rockylinux8.6-py${PY_VERSION}"
  timeout: 3h
  tags:
    - nmz
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "master-aicc"'
  parallel:
    matrix:
      # DTK_PKG_NAME 只作为 CIUpload NIGHTLY 的解析输入，文件从不被读取。
      - DTK_VERSION: "26.04"
        PY_VERSION: ["3.10", "3.12"]
        DTK_PKG_NAME: "DTK-26.04-rc4-centos8-x86_64.tar.gz"
        DTK_PIP_INDEX_URL: "${PYPI_URL}/nightly/dtk2604/+simple/"
      - DTK_VERSION: "26.10"
        PY_VERSION: ["3.12"]
        DTK_PKG_NAME: "DTK-26.10-Rocky8.6-x86_64.tar.gz"
        DTK_PIP_INDEX_URL: "${PYPI_URL}/nightly/dtk2610/+simple/"
  before_script:
    - python -m pip install "torch==${TORCH_VERSION}" -i "${DTK_PIP_INDEX_URL}" --trusted-host "${PIP_TRUSTED_HOST:-10.16.1.201}"
    - source ci_script/prepare_environment.sh
    - |
      cat > /tmp/git-askpass.sh << 'SCRIPT'
      #!/bin/sh
      case "$1" in
        *Username*) echo "gitlab-ci-token" ;;
        *Password*) echo "$GIT_TOKEN" ;;
      esac
      SCRIPT
    - chmod 700 /tmp/git-askpass.sh
    - export GIT_ASKPASS=/tmp/git-askpass.sh
    - export GIT_TERMINAL_PROMPT=0
    - export GIT_TOKEN="${CI_JOB_TOKEN}"
  script:
    - bash ci_script/build_wheel_and_manylinux.sh
    - COMMIT_ID="$(git rev-parse --short=6 HEAD)"
    - CIUpload REPAIR --dtk_version ${DTK_VERSION//./} --torch_version ${TORCH_VERSION} --git_commit ${COMMIT_ID} --outputdir output -f dist/*manylinux*.whl
    - CIUpload NIGHTLY --password ${devpi_nightly_password} --dtk_pkg_name "${DTK_PKG_NAME}" -f output/*.whl --record
  artifacts:
    paths:
      - output/*.whl
    expire_in: 30 days
